<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ====== META TAGS SEO (preservadas) ====== -->
    <title>Ayllah - Gestão de Eventos</title>
    <meta name="description" content="Sistema de gestão para espaços de casamento. Agende visitas, gere orçamentos e contratos, e gerencie pagamentos." />
    <meta name="author" content="Espaço Eventos" />

    <meta property="og:title" content="Ayllah - Gestão de Eventos" />
    <meta property="og:description" content="Sistema completo para gestão de eventos" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- ====== CSS CRÍTICO INLINE (NOVO) ====== -->
    <!-- Estilos mínimos para renderização inicial - elimina render-blocking -->
    <style>
      /* Reset mínimo */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      /* Variáveis de cor base */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --muted: 210 40% 96.1%;
        --muted-foreground: 215.4 16.3% 46.9%;
        --primary: 222.2 47.4% 11.2%;
      }
      
      /* Estilo base do body */
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loading state inicial */
      .initial-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(var(--background));
      }
      
      .loader-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid hsl(var(--muted));
        border-top-color: hsl(var(--primary));
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Loading inicial (substituído pelo React) -->
    <div id="root">
      <div class="initial-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
